services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vet_registration}
      MYSQL_USER: ${MYSQL_USER:-vet_registration}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '--protocol=TCP', '--host=127.0.0.1', '--silent']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
